services:
  - type: web
    name: assignment-submission-system-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: assignment-submission-system-db
          property: connectionString
      - key: SubmissionStorage__RootPath
        value: /tmp/submissions
      - key: DataProtection__KeyRingPath
        value: /tmp/data-protection-keys
      - key: DemoData__Enabled
        value: "true"
      - key: DemoAccounts__AdminInstitutionalId
        value: DEMO-ADM-001
      - key: DemoAccounts__AdminPassword
        value: Admin!nVPT7mB4lxeZBUq2XwI
      - key: DemoAccounts__TeacherInstitutionalId
        value: DEMO-TCH-001
      - key: DemoAccounts__TeacherPassword
        value: Teacher!XQt7fpdAg1jQJ7fGgSw
      - key: DemoAccounts__StudentInstitutionalId
        value: DEMO-STU-001
      - key: DemoAccounts__StudentPassword
        value: Student!v5lVJbrqfRO0m93zrKQ
      - key: BootstrapAdmin__Enabled
        value: "false"
      - key: Jwt__Issuer
        sync: false
      - key: Jwt__Audience
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false

  - type: web
    name: assignment-submission-system-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

databases:
  - name: assignment-submission-system-db
    plan: free
