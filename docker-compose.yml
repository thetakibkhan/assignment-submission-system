services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_submission}
      POSTGRES_USER: ${POSTGRES_USER:-assignment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the database.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DB:-assignment_submission};Username=${POSTGRES_USER:-assignment_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the API.}
    command: bash -lc "dotnet restore AssignmentSubmissionSystem.slnx && dotnet run --project apps/api/AssignmentSubmissionSystem.Api --urls http://0.0.0.0:8080"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5112:8080"
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages

volumes:
  nuget-cache:
  postgres-data:
